<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="retint" content="#14c94a">
<title>Matrix</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
// Chuva digital: grade de células com brilho que decai. Cada coluna tem gotas com
// velocidade própria; a cabeça é branca, o rastro esverdeado, e glifos trocam sozinhos.
// A simulação roda na CPU (poucos milhares de números por quadro); o desenho e o brilho (glow) rodam
// na GPU em WebGL: um quadro são quatro passadas de tela cheia e um upload de textura minúsculo,
// em vez de milhares de drawImage em canvas 2D.
const cv = document.getElementById('gl');
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ012345789Z:・."=*+-<>¦｜ﾆ';
const NG = [...GLYPHS].length, ATLAS_COLS = 16, ATLAS_ROWS = Math.ceil(NG / ATLAS_COLS);

let gl, W, H, CELL, cols, rows, glyphs, bright, drops, cells;
let progGrid, progBlur, progComp, quad, atlasTex, cellTex, rainT, glowA, glowB, lost = false;

const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS_GRID = `precision highp float;
varying vec2 v;
uniform vec2 uRes, uGrid, uAtlas; uniform float uCell;
uniform sampler2D uCells, uTex;
const vec3 HEAD = vec3(.910,1.,.910), HOT = vec3(.490,1.,.604), BODY = vec3(.078,.788,.290);
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 cell = floor(p / uCell);
  if (cell.x >= uGrid.x || cell.y >= uGrid.y) { gl_FragColor = vec4(0.,0.,0.,1.); return; }
  vec4 c = texture2D(uCells, (cell + .5) / uGrid);
  float b = c.g, head = c.b;
  if (b < .03 && head < .5) { gl_FragColor = vec4(0.,0.,0.,1.); return; }
  float gi = floor(c.r*255. + .5);
  vec2 lp = floor(p - cell*uCell);
  vec2 ap = vec2(mod(gi, ${ATLAS_COLS}.) * uCell + lp.x, floor(gi / ${ATLAS_COLS}.) * uCell + lp.y) + .5;
  float cov = texture2D(uTex, ap / uAtlas).a;
  vec3 col = (b > .8 ? HOT : BODY) * cov * min(1., b*1.15);
  if (head > .5) col = HEAD*cov + col*(1. - cov);
  gl_FragColor = vec4(col, 1.);
}`;
// Desfoque gaussiano separável de 9 taps (o filtro linear da textura completa o espaço entre eles).
const FS_BLUR = `precision highp float;
varying vec2 v; uniform sampler2D uSrc; uniform vec2 uStep;
void main(){
  vec3 s = vec3(0.); float wsum = 0.;
  for (int i = -4; i <= 4; i++) {
    float f = float(i), w = exp(-f*f*.125);
    s += texture2D(uSrc, v + uStep*f).rgb * w; wsum += w;
  }
  gl_FragColor = vec4(s/wsum, 1.);
}`;
// Tela = chuva "screen" brilho (o antigo blur(7px) brightness(1.6) opacity .55 em mix-blend-mode: screen).
const FS_COMP = `precision highp float;
varying vec2 v; uniform sampler2D uRain, uGlow;
void main(){
  vec3 a = texture2D(uRain, v).rgb, g = texture2D(uGlow, v).rgb * (1.6*.55);
  gl_FragColor = vec4(1. - (1.-a)*(1.-g), 1.);
}`;

function program(fs) {
  const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr);
  pr.u = n => gl.getUniformLocation(pr, n);
  return pr;
}
function target(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function bind(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }
function pass(prog, dst, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.f : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(prog); setup(); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Atlas: cada glifo pré-desenhado (espelhado, como no filme) em branco; a cor sai no shader.
function buildAtlas() {
  const c = document.createElement('canvas');
  c.width = CELL * ATLAS_COLS; c.height = CELL * ATLAS_ROWS;
  const x = c.getContext('2d');
  x.font = `${Math.round(CELL * 0.86)}px "MS Gothic", "Yu Gothic", monospace`;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  [...GLYPHS].forEach((g, i) => {
    x.save(); x.translate((i % ATLAS_COLS) * CELL + CELL / 2, Math.floor(i / ATLAS_COLS) * CELL + CELL / 2); x.scale(-1, 1); x.fillText(g, 0, 0); x.restore();
  });
  atlasTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  atlasTex.w = c.width; atlasTex.h = c.height;
}

function initGL() {
  gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
  if (!gl) throw new Error('WebGL indisponível');
  progGrid = program(FS_GRID); progBlur = program(FS_BLUR); progComp = program(FS_COMP);
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  cellTex = null; resize();
}
function resize() {
  if (!gl) return;
  // Recursos da resolução anterior (resize repetido não pode vazar memória de GPU)
  for (const t of [atlasTex, cellTex, rainT && rainT.t, glowA && glowA.t, glowB && glowB.t]) if (t) gl.deleteTexture(t);
  for (const f of [rainT, glowA, glowB]) if (f) gl.deleteFramebuffer(f.f);
  const d = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = Math.max(1, Math.round(innerWidth * d)); H = cv.height = Math.max(1, Math.round(innerHeight * d));
  CELL = Math.round(Math.max(14, Math.min(W, H) / 48));
  cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL) + 1;
  glyphs = new Uint8Array(cols * rows).map(() => (Math.random() * NG) | 0);
  bright = new Float32Array(cols * rows);
  cells = new Uint8Array(cols * rows * 4);
  drops = [];
  for (let c = 0; c < cols; c++) for (let k = 0; k < 2; k++) drops.push(newDrop(c, true));
  buildAtlas();
  cellTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, cellTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  rainT = target(W, H);
  const gw = Math.max(1, Math.round(W / 3)), gh = Math.max(1, Math.round(H / 3));
  glowA = target(gw, gh); glowB = target(gw, gh);
}
function newDrop(col, anywhere) {
  return { col, y: anywhere ? Math.random() * rows * 2 - rows : -Math.random() * rows * 0.6,
    speed: 7 + Math.random() * 16, fade: 0.55 + Math.random() * 0.9 };
}
addEventListener('resize', resize);
cv.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; });
cv.addEventListener('webglcontextrestored', () => { lost = false; initGL(); });
initGL();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (lost) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const a = window.engine ? engine.audio : { bass: 0 };
  const boost = 1 + a.bass * 0.8;

  // Decaimento do rastro (taxa por coluna dá variedade de comprimento)
  for (let i = 0; i < bright.length; i++) if (bright[i] > 0) bright[i] = Math.max(0, bright[i] - dt * 0.9);
  // Glifos trocam aleatoriamente
  for (let n = 0; n < cols * 0.6; n++) glyphs[(Math.random() * glyphs.length) | 0] = (Math.random() * NG) | 0;

  const heads = [];
  for (const d of drops) {
    const prev = Math.floor(d.y);
    d.y += d.speed * dt * boost;
    const cur = Math.floor(d.y);
    for (let r = prev + 1; r <= cur; r++) {
      if (r >= 0 && r < rows) {
        const i = r * cols + d.col;
        bright[i] = d.fade;
        glyphs[i] = (Math.random() * NG) | 0;
      }
    }
    if (cur >= 0 && cur < rows) heads.push(cur * cols + d.col);
    if (d.y > rows + 30) Object.assign(d, newDrop(d.col, false));
  }

  // Estado da grade para a GPU: R = glifo, G = brilho, B = cabeça da gota
  for (let i = 0, o = 0; i < bright.length; i++, o += 4) {
    cells[o] = glyphs[i]; cells[o + 1] = Math.min(255, Math.round(bright[i] * 255)); cells[o + 2] = 0;
  }
  for (const i of heads) cells[i * 4 + 2] = 255;
  bind(1, cellTex); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, cells);

  const d = Math.min(devicePixelRatio || 1, 2), sigma = 7 * d / 3; // blur(7px) CSS, medido em texels do glow
  pass(progGrid, rainT, () => {
    bind(0, atlasTex); bind(1, cellTex);
    gl.uniform1i(progGrid.u('uTex'), 0); gl.uniform1i(progGrid.u('uCells'), 1);
    gl.uniform2f(progGrid.u('uRes'), W, H); gl.uniform2f(progGrid.u('uGrid'), cols, rows);
    gl.uniform2f(progGrid.u('uAtlas'), atlasTex.w, atlasTex.h); gl.uniform1f(progGrid.u('uCell'), CELL);
  });
  pass(progBlur, glowA, () => {
    bind(0, rainT.t); gl.uniform1i(progBlur.u('uSrc'), 0);
    gl.uniform2f(progBlur.u('uStep'), sigma * .5 / glowA.w, 0);
  });
  pass(progBlur, glowB, () => {
    bind(0, glowA.t); gl.uniform1i(progBlur.u('uSrc'), 0);
    gl.uniform2f(progBlur.u('uStep'), 0, sigma * .5 / glowA.h);
  });
  pass(progComp, null, () => {
    bind(0, rainT.t); bind(1, glowB.t);
    gl.uniform1i(progComp.u('uRain'), 0); gl.uniform1i(progComp.u('uGlow'), 1);
  });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
