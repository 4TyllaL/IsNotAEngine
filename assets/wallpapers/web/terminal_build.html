let rnd = (() => { let a = (Date.now() % 4294967296) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
const pick = a => a[Math.floor(rnd() * a.length)];
const hex = n => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(rnd() * 16)]).join('');
const STEPS = ['checkout', 'build', 'test', 'lint', 'package'];
const lines = [];                 // { ts, segs }

const T = (s, c = 't', b = false) => [s, c, b];
const elapsed = () => run ? (performance.now() - run.start) * SPEED : 0;
const fmtTs = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtDur = ms => ms >= 60000 ? `${Math.floor(ms / 60000)}m ${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}s` : (ms / 1000).toFixed(ms >= 10000 ? 0 : 1) + 's';
function push(segs) { lines.push({ ts: fmtTs(elapsed()), segs }); while (lines.length > 500) lines.shift(); dirtyLog = true; }

const sleep = ms => new Promise(r => setTimeout(r, ms / SPEED));

async function wait(ms) { await visible(); await sleep(ms); }
const jitter = (a, b) => a + rnd() * (b - a);

function step(name, state) { const s = run.steps.find(x => x.name === name); if (state === 'run') s.t0 = performance.now(); if (state === 'ok' || state === 'fail') s.t1 = performance.now(); s.state = state; }
const stepMs = s => s.t0 ? ((s.t1 || performance.now()) - s.t0) * SPEED : 0;

// ---------- o pipeline ----------
async function checkout() {
  step('checkout', 'run');
  push([T('$ ', 'g', true), T('git fetch --prune origin', 'b')]); await wait(jitter(500, 900));
  push([T('From github.com:isnotaengine/isnotaengine')]); await wait(250);
  push([T('   ' + run.prev + '..' + run.commit + '  ' + run.branch + '    -> origin/' + run.branch, 'd')]); await wait(450);
  push([T('$ ', 'g', true), T('git checkout --detach ' + run.commit, 'b')]); await wait(jitter(400, 700));
  push([T('HEAD is now at ' + run.commit + ' ', 'y'), T(run.message)]); await wait(500);
  step('checkout', 'ok');
}
async function build() {
  step('build', 'run');
  push([T('$ ', 'g', true), T('cargo build --release', 'b')]); await wait(500);
  cargo('Updating', '`crates-io` index'); await wait(jitter(500, 900));
  cargo('Downloaded', `${6 + Math.floor(rnd() * 9)} crates (${(0.8 + rnd() * 2).toFixed(1)} MiB) in ${(0.5 + rnd()).toFixed(2)}s`); await wait(350);
  const order = CRATES.slice().sort(() => rnd() - 0.5), total = order.length + 1;
  let done = 0;
  while (done < order.length) {
    const burst = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < burst && done < order.length; k++, done++) {
      const name = order[done];
      cargo('Compiling', name); const next = order.slice(done + 1, done + 3).map(n => n.split(' ')[0]).join(', ');
      live = [T('    Building'.padStart(12), 'g', true), T(' [' + '='.repeat(Math.floor(done / total * 26)) + '>' + ' '.repeat(26 - Math.floor(done / total * 26)) + '] ' + (done + 1) + '/' + total + ': ' + next)];
      await visible(); await sleep(jitter(15, 70));
    }
    if (rnd() < 0.11) { push([T('# ' + pick(ASIDES), 'd')]); }
    const heavy = /^(windows|wry|webview2|syn|zip|png)/.test(order[Math.min(done, order.length - 1)]);
    await wait(heavy ? jitter(500, 1100) : jitter(60, 260));
  }
  cargo('Compiling', 'IsNotAEngine v0.1.0 (C:\\dev\\isnotaengine)');
  live = [T('    Building'.padStart(12), 'g', true), T(' [==========================>] ' + total + '/' + total + ': IsNotAEngine(bin)')];
  await wait(jitter(2500, 4500));
  if (rnd() < 0.45 || FORCE === 'warn') {
    const nw = 1 + Math.floor(rnd() * 2), ws = WARNINGS.slice().sort(() => rnd() - 0.5).slice(0, nw);
    for (const w of ws) {
      push([T('warning', 'y', true), T(': ' + w.msg, 't', true)]);
      push([T('   --> ', 'b', true), T(`${w.file}:${w.ln}:${w.col}`, 'b')]);
      push([T('    |', 'b', true)]);
      push([T(String(w.ln).padStart(3) + ' |', 'b', true), T(' ' + w.code)]);
      push([T('    |', 'b', true), T(' '.repeat(w.col) + '^'.repeat(w.len) + (w.help ? ' help: ' + w.help : ''), 'y', true)]);
      push([T('    |', 'b', true)]);
      push([T('    = ', 'b', true), T('note', 't', true), T(': `#[warn(' + w.lint + ')]` on by default')]);
      push([]); await wait(180);
    }
    push([T('warning', 'y', true), T(`: \`IsNotAEngine\` (bin "IsNotAEngine") generated ${nw} warning${nw > 1 ? 's' : ''}`, 't', true)]);
  }
  live = null;
  cargo('Finished', '`release` profile [optimized] target(s) in ' + (stepMs(run.steps[1]) / 1000).toFixed(2) + 's');
  await wait(600); step('build', 'ok');
}

  step('test', 'run');
  push([T('$ ', 'g', true), T('cargo test --release', 'b')]); await wait(450);
  cargo('Compiling', 'IsNotAEngine v0.1.0 (C:\\dev\\isnotaengine)'); await wait(jitter(2500, 4000));
  cargo('Finished', '`release` profile [optimized] target(s) in ' + (3 + rnd() * 3).toFixed(2) + 's');
  cargo('Running', 'unittests src\\main.rs (target\\release\\deps\\IsNotAEngine-' + hex(16) + '.exe)'); await wait(500);
  const extras = rnd() < 0.5 ? EXTRA_TESTS.slice().sort(() => rnd() - 0.5).slice(0, 1 + Math.floor(rnd() * 2)) : [];
  push([]); push([T('running ' + (TESTS.length + extras.length) + ' tests')]); await wait(250);
  const fail = (rnd() < 0.07 || FORCE === 'fail') && run.attempt === 1 ? 'render::bloom::tests::parses_directive' : null;
  const order = TESTS.concat(extras).sort(() => rnd() - 0.5);
  for (const t of order) {
    if (t === IGNORED) push([T('test ' + t + ' ... '), T('ignored', 'y')]);
    else if (t === fail) push([T('test ' + t + ' ... '), T('FAILED', 'r', true)]);
    else push([T('test ' + t + ' ... '), T('ok', 'g')]);
    await wait(jitter(50, 260));
  }
  push([]);
  const passed = TESTS.length + extras.length - 1 - (fail ? 1 : 0), secs = (0.6 + rnd() * 0.9).toFixed(2);
  if (fail) {
    push([T('failures:')]); push([]);
    push([T('---- ' + fail + ' stdout ----')]);
    push([T("thread '" + fail + "' panicked at src\\render\\bloom.rs:402:9:", 'r')]);

// ---------- desenho ----------
let W = 0, H = 0, D = 1, fs = 16, lh = 24, cw = 9;

function layout() {

  cv.width = Math.round(W * D); cv.height = Math.round(H * D); g.setTransform(D, 0, 0, D, 0, 0);
  g.textRendering = 'optimizeSpeed'; g.fontKerning = 'none';   // sem ligaturas: `--` não pode virar um travessão

const px = Math.round;
function segsWidth(segs) { let w = 0; for (const [s, , b] of segs) { g.font = FONT(b); w += g.measureText(s).width; } return w; }

}
function box(x, y, w, h, title, right) {

  g.font = FONT(false);

// geometria
function geom() {
  const padX = Math.round(W * 0.045 / cw) * cw, padY = Math.round(H * 0.06 / lh) * lh;
  const ax = padX, ay = padY, aw = W - padX * 2, bottom = H - padY - lh * 1.8;
  const logW = Math.round(aw * 0.68 / cw) * cw, gap = cw * 2;

// Quebra uma linha de segmentos em várias de no máximo `maxCols` caracteres, preferindo espaços; a continuação ganha recuo.
function wrapLine(segs, maxCols) {
  const flat = []; segs.forEach(([t, c, b]) => { for (const ch of t) flat.push([ch, c, b]); });
  if (flat.length <= maxCols) return [segs];

  while (start < flat.length) {
    const room = out.length ? maxCols - 4 : maxCols; let end = Math.min(flat.length, start + room);
    if (end < flat.length) { for (let k = end; k > start + room * 0.5; k--) if (flat[k][0] === ' ') { end = k; break; } }
    const line = out.length ? [T('    ', 'd')] : [];
    for (const [ch, c, b] of flat.slice(start, end)) { const last = line[line.length - 1]; if (last && last[1] === c && last[2] === b) last[0] += ch; else line.push([ch, c, b]); }
    out.push(line); start = end; while (start < flat.length && flat[start][0] === ' ') start++;

}
function paintLog() {
  const G = geom(); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = COL.bg; g.fillRect(G.ax - 2, G.ay - 8, G.logW + 4, G.h + 12);
  box(G.ax, G.ay, G.logW, G.h, 'output', run ? `${run.branch} @ ${run.commit}` : '');
  const padL = cw * 2, rows = Math.max(1, Math.floor((G.h - lh * 1.2) / lh));
  const tsW = cw * 7, maxCols = Math.max(20, Math.floor((G.logW - padL - tsW - cw * 2.2) / cw));

    g.font = FONT(false); g.textAlign = 'right'; g.fillStyle = COL.d; g.fillText(s.t0 ? fmtDur(stepMs(s)) : '\u2014', px(x + w), px(y)); y += lh * 1.25;
  }

  // últimas execuções
